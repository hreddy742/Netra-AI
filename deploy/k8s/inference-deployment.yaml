apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: netra
  labels:
    app.kubernetes.io/name: netra-ai
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netra-ai
        app.kubernetes.io/component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Required for SHM access between inference and mediabridge
      hostIPC: true
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference
          image: netra-ai/inference:latest
          command: ["python", "-m", "backend.services.inference.main"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: netra-config
            - secretRef:
                name: netra-secrets
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "500m"
              memory: "1Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "4000m"
              memory: "4Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
        - name: config
          configMap:
            name: netra-config
