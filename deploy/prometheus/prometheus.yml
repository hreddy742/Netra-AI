# Netra AI — Prometheus configuration
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: netra-local

rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"

scrape_configs:

  - job_name: netra_gateway
    static_configs:
      - targets: ["gateway:9090"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: netra_inference
    static_configs:
      - targets: ["inference:9090"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
